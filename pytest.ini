[pytest]
# Pytest configuration for AI-Powered Threat Detection System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    windows: Windows-specific tests

# Ignore paths
norecursedirs = .git .venv venv env __pycache__ *.egg-info dist build

# Coverage (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=src --cov-report=html --cov-report=term
